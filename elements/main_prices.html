<div class="price-card">
    <div class="price-card__media">
        <div class="price-card__badge">Сетка в подарок</div>
        <div
            class="price-images-scroll"
            data-field="images">
            <img
                class="price-card__image"
                src="/images/placeholders/price.svg"
                alt="" />
        </div>
    </div>

    <div class="price-card__content">
        <h3
            class="price-card__title"
            data-field="name">
            Название
        </h3>

        <ul class="price-card__params">
            <li data-field="text_1">Параметр 1</li>
            <li data-field="text_2">Параметр 2</li>
            <li data-field="text_3">Параметр 3</li>
        </ul>

        <div class="price-card__pricing">
            <span
                class="price-card__old-price"
                data-field="old_price"></span>
            <span
                class="price-card__new-price"
                data-field="new_price"></span>
        </div>

        <button
            class="price-card__cta"
            data-action="order"
            onclick="toggleModal()">
            Заказать расчёт
        </button>
    </div>
</div>
