<div class="review-card">
    <div class="review-card__header">
        <img
            class="review-card__avatar"
            src="/images/icons/person.png"
            alt=""
            data-field="avatar" />
        <div class="review-card__info">
            <h3
                class="review-card__name"
                data-field="name">
                Имя
            </h3>
            <span
                class="review-card__city"
                data-field="city"></span>
            <div class="review-card__rating">★★★★★</div>
        </div>
    </div>
    <p
        class="review-card__text"
        data-field="review">
        Текст отзыва
    </p>
    <div
        class="review-card__video"
        data-field="video"
        style="display: none">
        <video
            class="review-card__video-player"
            controls
            preload="metadata">
            <source
                src=""
                type="video/mp4" />
        </video>
    </div>
</div>
